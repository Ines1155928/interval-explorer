  <style>

    .hero{min-height:255px}.hero-copy{max-width:610px!important}.scene{position:relative;z-index:1;width:285px;height:178px;margin-left:28px;flex:0 0 auto}.scene-sky{position:absolute;inset:0 0 34px;border-radius:90px 90px 22px 22px;background:linear-gradient(#624a9d,#47347b);overflow:hidden;border:1px solid #ffffff1f}.scene-sky:before,.scene-sky:after{content:"";position:absolute;top:-14px;width:70px;height:140px;background:#4a327e;border-radius:0 0 70% 70%}.scene-sky:before{left:-8px;transform:rotate(-9deg)}.scene-sky:after{right:-8px;transform:rotate(9deg)}.stage-floor{position:absolute;left:12px;right:12px;bottom:0;height:55px;border-radius:50% 50% 18px 18px;background:linear-gradient(#efb764,#cf7c43);box-shadow:inset 0 8px 0 #ffd78e}.music-star{position:absolute;display:grid;place-items:center;width:48px;height:48px;border:3px solid #fff;border-radius:50%;background:#fffdf8;color:var(--purple);font-size:25px;font-weight:900;box-shadow:0 7px 0 #271a5355;animation:float 3s ease-in-out infinite}.star-one{left:65px;bottom:42px}.star-two{right:62px;bottom:64px;color:var(--coral);animation-delay:-1.5s}.floating-note{position:absolute;color:#e9f58c;font-size:22px;font-weight:900;animation:float 2.6s ease-in-out infinite}.note-a{left:36px;top:20px}.note-b{right:35px;top:27px;animation-delay:-.8s}.scene-label{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;padding:5px 13px;border-radius:99px;background:var(--lime);color:#354512;font-size:11px;font-weight:900;box-shadow:0 5px 0 #879b31}

    .story-strip{max-width:1164px;margin:0 auto 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.story-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:17px;background:#fff;padding:13px 16px;color:var(--ink);box-shadow:0 7px 20px #362b530c;transition:.18s}.story-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #362b5318}.story-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--purple);font-size:22px}.story-card:last-child .story-icon{background:#fff0e9;color:var(--coral)}.story-card b,.story-card small{display:block}.story-card small{margin-top:3px;color:var(--muted);line-height:1.4}.story-go{color:var(--purple);font-size:20px;font-weight:900}

    .stage-bubbles{display:flex;justify-content:center;gap:7px;margin:0 0 14px}.stage-bubbles i{width:11px;height:11px;border-radius:50%;background:#e5e0ec}.stage-bubbles i.on{background:var(--coral);box-shadow:0 0 0 4px #ffe7e2}.quiz-scene-title{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 12px}.quiz-scene-title b{color:var(--dark)}

<body>
  <header class="topbar"><button class="brand" id="home"><span class="mark">♪</span><span>音程探險家</span></button><div class="mission"><span id="mission-label">今天的任務</span><b id="mission-value">認識「度」</b></div></header>
  <section class="hero"><div><p class="eyebrow">INTERVAL LAB · 五年級音樂</p><h1>兩個音，有多遠？</h1><p class="hero-copy">音樂祭的舞台正在等待你！選兩個音符、聽一聽，再沿著音階數數看。記得：<strong>起點和終點都要算！</strong></p></div><div class="scene" aria-hidden="true"><div class="scene-sky"><span class="floating-note note-a">♫</span><span class="floating-note note-b">♩</span><span class="music-star star-one">Do</span><span class="music-star star-two">Sol</span></div><div class="stage-floor"></div><span class="scene-label">完成任務，點亮舞台！</span></div></section>
  <nav class="tabs" aria-label="學習模式"><button id="explore-tab" class="active"><span>✦</span>自由探索</button><button id="quiz-tab"><span>?</span>挑戰測驗</button></nav>
  <section class="story-strip" aria-label="任務選擇"><button class="story-card" id="story-explore"><span class="story-icon">♩</span><span><b>音符階梯練習場</b><small>自由選音，觀察音符的距離</small></span><span class="story-go">→</span></button><button class="story-card" id="story-quiz"><span class="story-icon">★</span><span><b>音樂祭舞台挑戰</b><small>完成 5 題任務，點亮整座舞台</small></span><span class="story-go">→</span></button></section>
  <section class="workspace" id="explore-view">
    <div class="card"><div class="heading"><div><span class="tag">STEP 1</span><h2>選擇兩個音符</h2></div><div class="switch"><button id="melody" class="selected">先後播放</button><button id="harmony">同時播放</button></div></div><div id="explore-staff"></div><div id="mode-card" class="mode-card"></div><div class="pickers"><fieldset><legend><span>1</span>第一個音</legend><div class="notes" id="first-notes"></div></fieldset><fieldset><legend><span>2</span>第二個音</legend><div class="notes" id="second-notes"></div></fieldset></div><button class="primary" id="play-explore">▶ 聽聽看 · 曲調音程</button></div>
    <aside class="card result" aria-live="polite"><span class="tag lime">STEP 2</span><h2>一起數音程</h2><div class="circle"><b id="degree">5</b><span>度</span></div><p class="pair" id="pair">Do → Sol</p><div class="path" id="path"></div><div class="tip"><span>💡</span><p><b>數音名，不是數空格</b><br><span id="explain"></span></p></div><div class="definition"><b>小祕訣</b><p>「度」就像音符之間的距離尺。數字越大，通常聽起來也越遠。</p></div></aside>
  </section>
  <section class="workspace hidden" id="quiz-view"></section>
  <script>
    const notes=[{id:'c4',letter:'C',name:'Do',midi:60,step:-2},{id:'d4',letter:'D',name:'Re',midi:62,step:-1},{id:'e4',letter:'E',name:'Mi',midi:64,step:0},{id:'f4',letter:'F',name:'Fa',midi:65,step:1},{id:'g4',letter:'G',name:'Sol',midi:67,step:2},{id:'a4',letter:'A',name:'La',midi:69,step:3},{id:'b4',letter:'B',name:'Si',midi:71,step:4},{id:'c5',letter:'C',name:'Do',midi:72,step:5}];
    const $=id=>document.getElementById(id);let first=0,second=4,isHarmony=false,question={a:1,b:4,h:false},qNo=1,answer=null,checked=false,score=0,finished=false;
    function tone(midi,start,duration,ctx){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.24,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+duration+.05)}
    function play(a,b,h){document.querySelectorAll('.staff:not(.hidden) .staff-note').forEach(n=>{n.classList.remove('sounding');void n.offsetWidth;n.classList.add('sounding')});const C=window.AudioContext||window.webkitAudioContext,c=new C,n=c.currentTime+.05;if(h){tone(a.midi,n,.85,c);tone(b.midi,n,.85,c)}else{tone(a.midi,n,.55,c);tone(b.midi,n+.58,.65,c)}setTimeout(()=>c.close(),1800)}
    function staff(a,b,h,labels){let lines='';for(let i=0;i<5;i++)lines+=`<span class="staff-line" style="bottom:${38+i*14}px"></span>`;const one=`<span class="staff-note one ${a.step===-2?'ledger':''}" style="left:${h?51:40}%;bottom:${38+a.step*7}px"><i></i>${labels?`<b>${a.name}</b>`:''}</span>`,two=`<span class="staff-note two ${b.step===-2?'ledger':''}" style="left:${h?51:70}%;bottom:${38+b.step*7}px"><i></i>${labels?`<b>${b.name}</b>`:''}</span>`;return `<div class="staff ${h?'harmony-staff':''}"><div class="clef">𝄞</div>${lines}${one}${two}${h?'':'<span class="arrow">→</span>'}</div>`}
    function noteButtons(target,selected,kind,handler){$(target).innerHTML=notes.map((n,i)=>`<button class="${i===selected?'picked '+kind:''}" data-i="${i}" aria-pressed="${i===selected}"><b>${n.name}</b><small>${n.letter}</small></button>`).join('');$(target).querySelectorAll('button').forEach(b=>b.onclick=()=>handler(+b.dataset.i))}
    function renderExplore(){noteButtons('first-notes',first,'first',i=>{first=i;renderExplore()});noteButtons('second-notes',second,'second',i=>{second=i;renderExplore()});$('explore-staff').innerHTML=staff(notes[first],notes[second],isHarmony,true);$('mode-card').className=`mode-card ${isHarmony?'harmony':''}`;$('mode-card').innerHTML=isHarmony?'<span>♬</span><p><b>和聲音程</b>兩個音「同時」發聲，所以樂譜會上下對齊排列。</p>':'<span>♩</span><p><b>曲調音程</b>兩個音「先後」出現，就像旋律向前走。</p>';const degree=Math.abs(second-first)+1,dir=first<=second?1:-1,path=Array.from({length:degree},(_,i)=>notes[first+i*dir]);$('degree').textContent=degree;$('pair').textContent=`${notes[first].name} → ${notes[second].name}`;$('path').innerHTML=path.map((n,i)=>`<div class="chip"><span>${i+1}</span><b>${n.name}</b></div>`).join('');$('explain').textContent=`從 ${notes[first].name} 數到 ${notes[second].name}，頭尾都包含，剛好是 ${degree} 個音名。`;$('melody').classList.toggle('selected',!isHarmony);$('harmony').classList.toggle('selected',isHarmony);$('play-explore').innerHTML=`▶ 聽聽看 · ${isHarmony?'和聲':'曲調'}音程`}
    $('melody').onclick=()=>{isHarmony=false;renderExplore()};$('harmony').onclick=()=>{isHarmony=true;renderExplore()};$('play-explore').onclick=()=>play(notes[first],notes[second],isHarmony);
    function newQuestion(){let n;do{n={a:Math.floor(Math.random()*8),b:Math.floor(Math.random()*8),h:Math.random()>.55}}while(n.a===question.a&&n.b===question.b);return n}
    function startQuiz(){question=newQuestion();qNo=1;answer=null;checked=false;score=0;finished=false;show('quiz');renderQuiz()}
    function renderQuiz(){if(finished){const msg=score===5?'全部答對，你已經是音程小達人！':score>=3?'很不錯！再挑戰一次，把「頭尾都要算」記牢。':'回到自由探索多試幾組音，再來挑戰一定會進步！';$('quiz-view').innerHTML=`<div class="card finish"><div style="color:var(--coral);font-size:28px">✦ ♪ ✦</div><p class="eyebrow" style="color:var(--purple);margin-top:18px">QUIZ COMPLETE</p><h2>完成挑戰！</h2><div class="score"><b>${score}</b><span>/ 5 題</span></div><p>${msg}</p><div class="actions"><button class="secondary" id="back-explore">回自由探索</button><button class="primary" id="restart">再挑戰一次</button></div></div>`;$('back-explore').onclick=()=>show('explore');$('restart').onclick=startQuiz;return}
      const correct=Math.abs(question.b-question.a)+1,isRight=answer===correct,feedback=checked?`<div class="feedback ${isRight?'good':'bad'}"><span>${isRight?'✓':'!'}</span><p><b>${isRight?'答對了，太棒了！':`差一點，正確答案是 ${correct} 度`}</b><br>${notes[question.a].name} → ${notes[question.b].name}：包含頭尾，一共數 ${correct} 個音名。</p><button id="next">${qNo===5?'看成績':'下一題'} →</button></div>`:'';
      $('quiz-view').innerHTML=`<div class="card"><div class="progress"><span style="width:${qNo*20}%"></span></div><div class="stage-bubbles">${[1,2,3,4,5].map(n=>`<i class="${n<=qNo?'on':''}"></i>`).join('')}</div><p class="quiz-scene-title">音樂祭舞台任務 · <b>點亮第 ${qNo} 盞燈</b></p><div class="heading"><div><span class="tag coral">QUESTION ${qNo}</span><h2>這兩個音是幾度？</h2></div><span class="qtype">● ${question.h?'和聲音程 · 同時播放':'曲調音程 · 先後播放'}</span></div>${staff(notes[question.a],notes[question.b],question.h,false)}<button class="listen" id="play-quiz">▶ 播放音程</button><div class="answers">${[1,2,3,4,5,6,7,8].map(d=>`<button data-d="${d}" ${checked?'disabled':''} class="${answer===d?'chosen ':''}${checked&&d===correct?'correct ':''}${checked&&answer===d&&d!==correct?'wrong':''}"><b>${d}</b><span>度</span></button>`).join('')}</div>${checked?feedback:`<button class="primary" id="check" ${answer===null?'disabled':''}>確認答案</button>`}</div><aside class="card result quiz-side"><span class="tag lime">挑戰進行中</span><div class="circle"><b>${score}</b><span>目前答對</span></div><div class="rules"><b>解題三步驟</b><ol><li>認出兩個音的位置</li><li>從第一個音開始數</li><li>頭尾都算，選出「度」</li></ol></div><div class="tip"><span>👂</span><p><b>可以多聽幾次</b><br>先後播放是曲調音程，同時播放是和聲音程。</p></div></aside>`;
      $('play-quiz').onclick=()=>play(notes[question.a],notes[question.b],question.h);document.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>{if(!checked){answer=+b.dataset.d;renderQuiz()}});if(!checked)$('check').onclick=()=>{if(answer!==null){checked=true;if(answer===correct)score++;renderQuiz()}};else $('next').onclick=()=>{if(qNo===5)finished=true;else{qNo++;question=newQuestion();answer=null;checked=false}renderQuiz()};$('mission-label').textContent=`第 ${qNo} 題`;$('mission-value').textContent=`${score} 分`}
    function show(mode){const quiz=mode==='quiz';$('explore-view').classList.toggle('hidden',quiz);$('quiz-view').classList.toggle('hidden',!quiz);$('explore-tab').classList.toggle('active',!quiz);$('quiz-tab').classList.toggle('active',quiz);if(!quiz){$('mission-label').textContent='今天的任務';$('mission-value').textContent='認識「度」'}}
    $('explore-tab').onclick=()=>show('explore');$('quiz-tab').onclick=startQuiz;$('story-explore').onclick=()=>show('explore');$('story-quiz').onclick=startQuiz;$('home').onclick=()=>show('explore');renderExplore();
  </script>
</body>
</html>
