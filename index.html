  <section class="workspace" id="explore-view">

    <aside class="card result" aria-live="polite"><span class="tag lime">STEP 2</span><h2>一起數音程</h2><div class="circle"><b id="degree">5</b><span>度</span></div><p class="pair" id="pair">Do → Sol</p><div class="path" id="path"></div><div class="tip"><span>💡</span><p><b>數音名，不是數空格</b><br><span id="explain"></span></p></div><div class="definition"><b>小祕訣</b><p>「度」就像音符之間的距離尺。數字越大，通常聽起來也越遠。</p></div></aside>

    const notes=[{id:'c4',letter:'C',name:'Do',midi:60,step:-2},{id:'d4',letter:'D',name:'Re',midi:62,step:-1},{id:'e4',letter:'E',name:'Mi',midi:64,step:0},{id:'f4',letter:'F',name:'Fa',midi:65,step:1},{id:'g4',letter:'G',name:'Sol',midi:67,step:2},{id:'a4',letter:'A',name:'La',midi:69,step:3},{id:'b4',letter:'B',name:'Si',midi:71,step:4},{id:'c5',letter:'C',name:'Do',midi:72,step:5}];
    const $=id=>document.getElementById(id);let first=0,second=4,isHarmony=false,question={a:1,b:4,h:false,kind:'degree'},qNo=1,answer=null,checked=false,score=0,finished=false,activeMode='explore';
    const touchInput=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;let shooterStatus='ready',shooterTime=60,shooterScore=0,shooterCombo=0,shooterBest=0,shooterRound=0,shooterQuestion=null,shooterAnswered=false,selectedLane=0,shooterTick=null,shooterFallTimer=null,shooterNextTimer=null,trainDirection='up',trainQuestion=null,trainPicked=[],trainStars=0,trainAnswer=null,trainChecked=false,trainMessage='',trainDragIndex=null;
    function tone(midi,start,duration,ctx){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.36,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+duration+.05)}
    function play(a,b,h){document.querySelectorAll('.staff:not(.hidden) .staff-note').forEach(n=>{n.classList.remove('sounding');void n.offsetWidth;n.classList.add('sounding')});const C=window.AudioContext||window.webkitAudioContext,c=new C,n=c.currentTime+.05;if(h){tone(a.midi,n,.85,c);tone(b.midi,n,.85,c)}else{tone(a.midi,n,.55,c);tone(b.midi,n+.58,.65,c)}setTimeout(()=>c.close(),1800)}
    function staff(a,b,h,labels){let lines='';for(let i=0;i<5;i++)lines+=`<span class="staff-line" style="bottom:${38+i*14}px"></span>`;const isSecond=h&&Math.abs(a.step-b.step)===1,ax=h?(isSecond?(a.step<b.step?49:53):51):46,bx=h?(isSecond?(b.step<a.step?49:53):51):58,aSide=isSecond&&a.step>b.step?'label-right':'label-left',bSide=isSecond&&b.step<a.step?'label-left':'label-right',one=`<span class="staff-note one ${aSide} ${a.step===-2?'ledger':''}" style="left:${ax}%;bottom:${38+a.step*7}px"><i></i>${labels?`<b>${a.name}</b>`:''}</span>`,two=`<span class="staff-note two ${bSide} ${b.step===-2?'ledger':''}" style="left:${bx}%;bottom:${38+b.step*7}px"><i></i>${labels?`<b>${b.name}</b>`:''}</span>`;return `<div class="staff ${h?'harmony-staff':''} ${isSecond?'harmonic-second':''}"><div class="clef">𝄞</div>${lines}${one}${two}${h?'':'<span class="arrow">→</span>'}</div>`}
    function noteButtons(target,selected,kind,handler){$(target).innerHTML=notes.map((n,i)=>`<button class="${i===selected?'picked '+kind:''}" data-i="${i}" aria-pressed="${i===selected}"><b>${n.name}</b><small>${n.letter}</small></button>`).join('');$(target).querySelectorAll('button').forEach(b=>b.onclick=()=>handler(+b.dataset.i))}
    function renderExplore(){noteButtons('first-notes',first,'first',i=>{first=i;renderExplore()});noteButtons('second-notes',second,'second',i=>{second=i;renderExplore()});$('explore-staff').innerHTML=staff(notes[first],notes[second],isHarmony,true);$('mode-card').className=`mode-card ${isHarmony?'harmony':''}`;$('mode-card').innerHTML=isHarmony?'<span>♬</span><p><b>和聲音程</b>兩個音「同時」發聲，所以樂譜會上下對齊排列。</p>':'<span>♩</span><p><b>曲調音程</b>兩個音「先後」出現，就像旋律向前走。</p>';const degree=Math.abs(second-first)+1,dir=first<=second?1:-1,path=Array.from({length:degree},(_,i)=>notes[first+i*dir]);$('degree').textContent=degree;$('pair').textContent=`${notes[first].name} → ${notes[second].name}`;$('path').innerHTML=path.map((n,i)=>`<div class="chip"><span>${i+1}</span><b>${n.name}</b></div>`).join('');$('explain').textContent=`從 ${notes[first].name} 數到 ${notes[second].name}，頭尾都包含，剛好是 ${degree} 個音名。`;$('melody').classList.toggle('selected',!isHarmony);$('harmony').classList.toggle('selected',isHarmony);$('play-explore').innerHTML=`▶ 聽聽看 · ${isHarmony?'和聲':'曲調'}音程`}
    $('melody').onclick=()=>{isHarmony=false;renderExplore()};$('harmony').onclick=()=>{isHarmony=true;renderExplore()};$('play-explore').onclick=()=>play(notes[first],notes[second],isHarmony);
    function newQuestion(){let n;do{n={a:Math.floor(Math.random()*8),b:Math.floor(Math.random()*8),h:Math.random()>.55,kind:question.kind==='degree'?'soundType':'degree'}}while(n.a===question.a&&n.b===question.b);return n}
    function startQuiz(){question=newQuestion();qNo=1;answer=null;checked=false;score=0;finished=false;show('quiz');renderQuiz()}
    function renderQuiz(){if(finished){const msg=score===5?'全部答對，你已經是音程小
達人！':score>=3?'很不錯！兩種題型都掌握得很好。':'回到自由探索多聽、多數幾組音，再來挑戰一定會進步！';$('quiz-view').innerHTML=`<div class="card finish"><div style="color:var(--coral);font-size:28px">✦ ♪ ✦</div><p class="eyebrow" style="color:var(--purple);margin-top:18px">QUIZ COMPLETE</p><h2>完成挑戰！</h2><div class="score"><b>${score}</b><span>/ 5 題</span></div><p>${msg}</p><div class="actions"><button class="secondary" id="back-explore">回自由探索</button><button class="primary" id="restart">再挑戰一次</button></div></div>`;$('back-explore').onclick=()=>show('explore');$('restart').onclick=startQuiz;return}
      const degree=Math.abs(question.b-question.a)+1,correct=question.kind==='degree'?degree:(question.h?'harmony':'melody'),isRight=answer===correct,correctLabel=question.kind==='degree'?`${degree} 度`:(question.h?'和聲音程':'曲調音程'),explanation=question.kind==='degree'?`${notes[question.a].name} → ${notes[question.b].name}：包含頭尾，一共數 ${degree} 個音名。`:(question.h?'兩個音同時發聲、在樂譜上上下排列，所以是和聲音程。':'兩個音先後發聲、在樂譜上左右前進，所以是曲調音程。'),feedback=checked?`<div class="feedback ${isRight?'good':'bad'}"><span>${isRight?'✓':'!'}</span><p><b>${isRight?'答對了，太棒了！':`差一點，正確答案是${correctLabel}`}</b><br>${explanation}</p><button id="next">${qNo===5?'看成績':'下一題'} →</button></div>`:'',typeQuestion=question.kind==='soundType',answerButtons=typeQuestion?[['melody','曲調音程','先後播放'],['harmony','和聲音程','同時播放']].map(item=>`<button data-answer="${item[0]}" ${checked?'disabled':''} class="${answer===item[0]?'chosen ':''}${checked&&item[0]===correct?'correct ':''}${checked&&answer===item[0]&&item[0]!==correct?'wrong':''}"><b>${item[1]}</b><span>${item[2]}</span></button>`).join(''):[1,2,3,4,5,6,7,8].map(d=>`<button data-answer="${d}" ${checked?'disabled':''} class="${answer===d?'chosen ':''}${checked&&d===correct?'correct ':''}${checked&&answer===d&&d!==correct?'wrong':''}"><b>${d}</b><span>度</span></button>`).join('');
      $('quiz-view').innerHTML=`<div class="card"><div class="progress"><span style="width:${qNo*20}%"></span></div><div class="stage-bubbles">${[1,2,3,4,5].map(n=>`<i class="${n<=qNo?'on':''}"></i>`).join('')}</div><p class="quiz-scene-title">音樂祭舞台任務 · <b>點亮第 ${qNo} 盞燈</b></p><div class="heading"><div><span class="tag coral">QUESTION ${qNo}</span><h2>${typeQuestion?'這組音程是曲調還是和聲？':'這兩個音是幾度？'}</h2></div><span class="qtype">● ${typeQuestion?'播放方式題':'音程度數題'}</span></div>${staff(notes[question.a],notes[question.b],question.h,false)}<button class="listen" id="play-quiz">▶ 播放音程</button><div class="answers ${typeQuestion?'type-answers':''}">${answerButtons}</div>${checked?feedback:`<button class="primary" id="check" ${answer===null?'disabled':''}>確認答案</button>`}</div><aside class="card result quiz-side"><span class="tag lime">挑戰進行中</span><div class="circle"><b>${score}</b><span>目前答對</span></div><div class="rules"><b>兩種混合題型</b><ol><li>判斷音程是幾度</li><li>分辨曲調或和聲音程</li><li>可以重播，再確認答案</li></ol></div><div class="tip"><span>👂</span><p><b>聽聲音也看排列</b><br>先後播放是曲調音程，同時播放是和聲音程。</p></div></aside>`;
      $('play-quiz').onclick=()=>play(notes[question.a],notes[question.b],question.h);document.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>{if(!checked){answer=question.kind==='degree'?+b.dataset.answer:b.dataset.answer;renderQuiz()}});if(!checked)$('check').onclick=()=>{if(answer!==null){checked=true;if(answer===correct)score++;renderQuiz()}};else $('next').onclick=()=>{if(qNo===5)finished=true;else{qNo++;question=newQuestion();answer=null;checked=false}renderQuiz()};$('mission-label').textContent=`第 ${qNo} 題`;$('mission-value').textContent=`${score} 分`}
    function playOne(note){const C=window.AudioContext||window.webkitAudioContext,c=new C,n=c.currentTime+.04;tone(note.midi,n,.5,c);setTimeout(()=>c.close(),800)}
    function makeTrainQuestion(){const degree=3+Math.floor(Math.random()*3),distance=degree-1,start=trainDirection==='up'?Math.floor(Math.random()*(8-distance)):distance+Math.floor(Math.random()*(8-distance)),direction=trainDirection==='up'?1:-1,path=Array.from({length:degree},(_,i)=>start+i*direction),choices=new Set(path.slice(1));while(choices.size<Math.min(6,degree+2))choices.add(Math.floor(Math.random()*8));const options=[...choices];for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}return{degree,start,path,options}}
    function startTrain(){trainQuestion=makeTrainQuestion();trainPicked=[];trainStars=0;trainAnswer=null;trainChecked=false;trainMessage='先找下一個音符車廂。';show('train')}
    function trainPiece(note,kind,count){return`<div class="${kind}">${kind==='train-car'&&note===null?'＋':kind==='train-engine'?'':kind==='train-station'?'':''}${note!==null?`<b>${notes[note].name}</b><small>${kind==='train-engine'?'第 1 站':kind==='train-station'?'終點車站':`第 ${count} 站`}</small>`:''}</div>`}
    function renderTrain(){if(!trainQuestion)return;const q=trainQuestion,expected=q.path.slice(1),completed=trainPicked.length===expected.length,routeCars=expected.map((note,index)=>trainPiece(trainPicked[index]??null,`train-car ${trainPicked[index]!==undefined?'filled':''}`,index+2)).join(''),countDots=[1,2,3,4,5].map(n=>`<i class="${n<=trainStars?'on':''}"></i>`).join(''),used=new Set(trainPicked),bank=q.options.map(index=>`<button class="train-note ${used.has(index)?'used':''}" data-note="${index}" draggable="${!used.has(index)}" ${used.has(index)?'disabled':''}><b>${notes[index].name}</b><small>${notes[index].letter}</small></button>`).join(''),answerArea=completed?`<div class="train-complete"><b>火車到站了！${notes[q.start].name} 到 ${notes[q.path[q.path.length-1]].name} 是幾度？</b><div class="train-answer-grid">${[1,2,3,4,5,6].map(d=>`<button data-degree="${d}" ${trainChecked?'disabled':''} class="${trainAnswer===d?'chosen ':''}${trainChecked&&d===q.degree?'correct ':''}${trainChecked&&trainAnswer===d&&d!==q.degree?'wrong':''}">${d} 度</button>`).join('')}</div>${trainChecked?`<p class="train-message ${trainAnswer===q.degree?'':'wrong'}">${trainAnswer===q.degree?'答對了！下一段音階準備出發。':`還差一點，起點和終點都要算，答案是 ${q.degree} 度。`}</p><button id="train-next" class="primary train-next">下一段音階 →</button>`:''}</div>`:'';$('train-view').innerHTML=`<div class="card train-card"><div class="train-head"><div><span class="tag lime">STEP BY STEP</span><h2>音階小火車</h2></div><div class="train-switch"><button id="train-up" class="${trainDirection==='up'?'active':''}">往上練習</button><button id="train-down" class="${trainDirection==='down'?'active':''}">往下練習</button></div></div><div class="train-intro"><b>🚂 慢慢接對音符車廂</b>沒有倒數。每放對一節，火車就會播放那個音，幫你熟悉音階順序。</div><div class="train-progress"><span>完成路線</span>${countDots}</div><div class="train-stage"><div class="train-route"><div class="train-engine"><b>${notes[q.start].name}</b><small>第 1 站</small></div><span class="route-count">1</span>${routeCars}<div class="train-station"><b>${notes[q.path[q.path.length-1]].name}</b><small>終點車站</small></div></div><div class="train-track"></div></div><div class="train-bank"><p>選擇下一節車廂（可以直接點擊，也可以拖曳）</p><div class="train-bank-items">${bank}</div><div class="train
-message ${trainMessage.includes('不')?'wrong':''}">${trainMessage}</div></div>${answerArea}</div>`;$('train-up').onclick=()=>{trainDirection='up';trainQuestion=makeTrainQuestion();trainPicked=[];trainAnswer=null;trainChecked=false;trainMessage='先找下一個音符車廂。';renderTrain()};$('train-down').onclick=()=>{trainDirection='down';trainQuestion=makeTrainQuestion();trainPicked=[];trainAnswer=null;trainChecked=false;trainMessage='先找下一個音符車廂。';renderTrain()};document.querySelectorAll('.train-note').forEach(button=>{button.onclick=()=>addTrainNote(+button.dataset.note);button.ondragstart=()=>{trainDragIndex=+button.dataset.note}});document.querySelectorAll('.train-car:not(.filled)').forEach(car=>{car.ondragover=e=>e.preventDefault();car.ondrop=e=>{e.preventDefault();if(trainDragIndex!==null)addTrainNote(trainDragIndex)}});document.querySelectorAll('.train-answer-grid button').forEach(button=>button.onclick=()=>{if(!trainChecked){trainAnswer=+button.dataset.degree;trainChecked=true;if(trainAnswer===q.degree)trainStars++;renderTrain()}});if($('train-next'))$('train-next').onclick=()=>{trainQuestion=makeTrainQuestion();trainPicked=[];trainAnswer=null;trainChecked=false;trainMessage='新的路線出發囉！';renderTrain()}}
    function addTrainNote(index){if(!trainQuestion||trainChecked||trainPicked.includes(index))return;const expected=trainQuestion.path[trainPicked.length+1];if(index===expected){trainPicked.push(index);playOne(notes[index]);trainMessage=trainPicked.length===trainQuestion.path.length-1?'每一節都接對了！現在一起數音程。':`很好！${notes[index].name} 是第 ${trainPicked.length+1} 站。`}else{trainMessage=`這一節還不是下一個音。想想看，${notes[expected].name} 在哪裡？`}renderTrain()}
    function makeShooterQuestion(){const degree=2+Math.floor(Math.random()*4),distance=degree-1,up=Math.random()>.5,start=up?Math.floor(Math.random()*(8-distance)):distance+Math.floor(Math.random()*(8-distance)),target=start+(up?distance:-distance),choices=new Set([target]);while(choices.size<4)choices.add(Math.floor(Math.random()*8));const options=[...choices];for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}return{start,target,degree,up,options}}
    function shooterPrompt(q){return`從 <span class="prompt-start">${notes[q.start].name}</span> 往${q.up?'上':'下'} <strong>${q.degree} 度</strong>，要找到哪個音？`}
    function miniStaff(note){let lines='';for(let i=0;i<5;i++)lines+=`<i class="mini-line" style="bottom:${13+i*7}px"></i>`;const bottom=13+note.step*3.5,ledger=note.step===-2?`<i class="mini-ledger" style="bottom:${bottom}px"></i>`:'';return`<span class="mini-staff">${lines}${ledger}<i class="mini-whole" style="bottom:${bottom}px"></i></span>`}
    function announceShooter(){if(!shooterQuestion||shooterStatus!=='running')return;const n=notes[shooterQuestion.start];try{const C=window.AudioContext||window.webkitAudioContext,c=new C,t=c.currentTime+.03;tone(n.midi,t,.45,c);setTimeout(()=>c.close(),700)}catch(e){}}
    function updateShooterHud(){if($('shooter-time'))$('shooter-time').textContent=shooterTime;if($('shooter-score'))$('shooter-score').textContent=shooterScore;if($('shooter-combo'))$('shooter-combo').textContent=`${shooterCombo}×`;if(activeMode==='shooter'){$('mission-label').textContent=`第 ${shooterRound} 題`;$('mission-value').textContent=`${shooterScore} 分`}}
    function clearShooterTimers(){clearInterval(shooterTick);clearTimeout(shooterFallTimer);clearTimeout(shooterNextTimer);shooterTick=shooterFallTimer=shooterNextTimer=null}
    function renderShooter(){const device=touchInput?'觸控模式 · 點擊音符卡':'電腦模式 · 滑鼠或鍵盤';if(shooterStatus==='ready'){$('shooter-view').innerHTML=`<div class="card shooter-panel"><div class="shooter-ready"><div class="shooter-ready-icon">⚡</div><span class="tag">ADVANCED MISSION</span><h2>音程射手</h2><p>看清楚題目的起音、方向和度數，在音符卡掉到底以前擊中正確答案。答錯會扣 2 秒，連續答對可以累積 Combo！</p><button class="primary shooter-start" id="start-shooter">開始 60 秒挑戰</button><div class="shooter-help"><span>${device}</span><span>題目不朗讀，請自己閱讀</span><span>起點和終點都要算</span></div></div></div>`;$('start-shooter').onclick=startShooter;return}if(shooterStatus==='finished'){$('shooter-view').innerHTML=`<div class="card shooter-panel"><div class="shooter-finished"><span class="tag">TIME'S UP</span><h2>挑戰完成！</h2><p class="shooter-final-score">${shooterScore}<small> 題答對</small></p><p>最高連擊 ${shooterBest}×，一共挑戰 ${shooterRound} 題。${shooterScore>=8?'你的音程反應非常敏銳！':'再玩一次，試著把唱名階梯在心裡數得更快。'}</p><div class="shooter-actions"><button class="secondary" id="shooter-back">回自由探索</button><button class="primary" id="shooter-restart">再挑戰一次</button></div></div></div>`;$('shooter-back').onclick=()=>show('explore');$('shooter-restart').onclick=startShooter;return}$('shooter-view').innerHTML=`<div class="card shooter-panel"><div class="shooter-top"><div><span class="tag">INTERVAL BLASTER</span><h2>音程射手</h2></div><div class="shooter-device"><i class="device-dot"></i>${device}</div></div><div class="shooter-hud"><div class="hud-item"><span>剩餘時間</span><b id="shooter-time">${shooterTime}</b></div><div class="hud-item"><span>答對題數</span><b id="shooter-score">${shooterScore}</b></div><div class="hud-item"><span>COMBO</span><b id="shooter-combo">${shooterCombo}×</b></div></div><div class="shooter-prompt" id="shooter-question" aria-live="polite"></div><div class="shooter-arena" id="shooter-arena"><div class="arena-stars"></div><div class="shooter-cannon"></div></div></div>`}
    function newShooterRound(){if(shooterStatus!=='running'||shooterTime<=0)return;clearTimeout(shooterFallTimer);clearTimeout(shooterNextTimer);shooterRound++;shooterAnswered=false;selectedLane=0;shooterQuestion=makeShooterQuestion();$('shooter-question').innerHTML=shooterPrompt(shooterQuestion);const arena=$('shooter-arena'),fall=touchInput?8.5:7.5;arena.classList.remove('round-answered');arena.innerHTML=`<div class="arena-stars"></div>${shooterQuestion.options.map((noteIndex,lane)=>`<button class="falling-card ${lane===0?'keyboard-focus':''}" data-lane="${lane}" data-note="${noteIndex}" style="left:${12.5+lane*25}%;--fall:${fall}s" aria-label="${notes[noteIndex].name} 音符卡">${miniStaff(notes[noteIndex])}<b>${notes[noteIndex].name}</b><small>${notes[noteIndex].letter}</small></button>`).join('')}<div class="shooter-cannon"></div><div id="shooter-feedback"></div>`;arena.querySelectorAll('.falling-card').forEach(card=>card.onclick=()=>resolveShot(+card.dataset.lane));updateShooterHud();setTimeout(announceShooter,120);shooterFallTimer=setTimeout(()=>resolveShot(-1),fall*1000)}
    function selectShooterLane(delta){if(shooterStatus!=='running'||shooterAnswered)return;selectedLane=(selectedLane+delta+4)%4;document.querySelectorAll('.falling-card').forEach((card,index)=>card.classList.toggle('keyboard-focus',index===selectedLane))}
    function resolveShot(lane){if(shooterStatus!=='running'||shooterAnswered||!shooterQuestion)return;shooterAnswered=true;clearTimeout(shooterFallTimer);const hit=lane>=0?shooterQuestion.options[lane]:-1,correct=hit===shooterQuestion.target,arena
=$('shooter-arena');arena.classList.add('round-answered');arena.querySelectorAll('.falling-card').forEach((card,index)=>{card.disabled=true;if(shooterQuestion.options[index]===shooterQuestion.target&&correct)card.classList.add('correct-hit');if(index===lane&&!correct)card.classList.add('wrong-hit')});if(correct){shooterScore++;shooterCombo++;shooterBest=Math.max(shooterBest,shooterCombo);play(notes[shooterQuestion.start],notes[shooterQuestion.target],false)}else{shooterCombo=0;shooterTime=Math.max(0,shooterTime-2)}const dir=shooterQuestion.up?1:-1,counted=Array.from({length:shooterQuestion.degree},(_,i)=>notes[shooterQuestion.start+i*dir].name).join('－'),feedback=$('shooter-feedback');feedback.className=`shooter-feedback ${correct?'good':'bad'}`;feedback.innerHTML=correct?`擊中了！<span>${counted}，是 ${shooterQuestion.degree} 度</span>`:`${lane<0?'音符卡掉下去了！':'這個音不對，扣 2 秒'}<span>正確答案是 ${notes[shooterQuestion.target].name}：${counted}</span>`;updateShooterHud();if(shooterTime<=0){shooterNextTimer=setTimeout(finishShooter,650)}else shooterNextTimer=setTimeout(newShooterRound,950)}
    function startShooter(){clearShooterTimers();shooterStatus='running';shooterTime=60;shooterScore=0;shooterCombo=0;shooterBest=0;shooterRound=0;show('shooter');renderShooter();newShooterRound();shooterTick=setInterval(()=>{shooterTime--;updateShooterHud();if(shooterTime<=0)finishShooter()},1000)}
    function finishShooter(){if(shooterStatus!=='running')return;clearShooterTimers();shooterStatus='finished';renderShooter();$('mission-label').textContent='挑戰完成';$('mission-value').textContent=`${shooterScore} 題`}
    function resetShooter(){clearShooterTimers();shooterStatus='ready';shooterQuestion=null}
    function show(mode){if(activeMode==='shooter'&&mode!=='shooter'&&shooterStatus==='running')resetShooter();activeMode=mode;const quiz=mode==='quiz',train=mode==='train',shooter=mode==='shooter';$('explore-view').classList.toggle('hidden',quiz||train||shooter);$('quiz-view').classList.toggle('hidden',!quiz);$('train-view').classList.toggle('hidden',!train);$('shooter-view').classList.toggle('hidden',!shooter);$('explore-tab').classList.toggle('active',mode==='explore');$('train-tab').classList.toggle('active',train);$('quiz-tab').classList.toggle('active',quiz);$('shooter-tab').classList.toggle('active',shooter);if(train){if(!trainQuestion){trainQuestion=makeTrainQuestion();trainPicked=[];trainMessage='先找下一個音符車廂。'}renderTrain();$('mission-label').textContent='基礎練習';$('mission-value').textContent='音階順序'}else if(shooter){renderShooter();if(shooterStatus==='ready'){$('mission-label').textContent='進階任務';$('mission-value').textContent='60 秒挑戰'}}else if(!quiz){$('mission-label').textContent='今天的任務';$('mission-value').textContent='認識「度」'}}
    document.addEventListener('keydown',event=>{if(activeMode!=='shooter'||shooterStatus!=='running')return;if(event.key==='ArrowLeft'){event.preventDefault();selectShooterLane(-1)}if(event.key==='ArrowRight'){event.preventDefault();selectShooterLane(1)}if(event.key===' '||event.key==='Enter'){event.preventDefault();resolveShot(selectedLane)}});
    $('explore-tab').onclick=()=>show('explore');$('train-tab').onclick=()=>show('train');$('quiz-tab').onclick=startQuiz;$('shooter-tab').onclick=()=>show('shooter');$('story-explore').onclick=()=>show('explore');$('story-train').onclick=startTrain;$('story-quiz').onclick=startQuiz;$('story-shooter').onclick=()=>show('shooter');$('home').onclick=()=>show('explore');renderExplore();
  </script>
