    function tone(midi,start,duration,ctx,target=ctx.destination){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.36,start+.025);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(target);o.start(start);o.stop(start+duration+.05)}

    const nativeSetTimeout=window.setTimeout.bind(window);window.setTimeout=(callback,delay,...args)=>{let id=nativeSetTimeout(()=>{trainPlaybackTimers=trainPlaybackTimers.filter(timer=>timer!==id);callback(...args)},delay);if(activeMode==='train')trainPlaybackTimers.push(id);return id}
    function play(a,b,h,flashScope){const notesToAnimate=flashScope?flashScope+' .staff-note':'.staff:not(.hidden) .staff-note';document.querySelectorAll(notesToAnimate).forEach(n=>{n.classList.remove('sounding');void n.offsetWidth;n.classList.add('sounding')});const C=window.AudioContext||window.webkitAudioContext,c=new C,n=c.currentTime+.05,bus=c.createGain(),dry=c.createGain(),wet=c.createGain(),reverb=makeReverb(c);dry.gain.value=.78;wet.gain.value=.58;bus.connect(dry).connect(c.destination);bus.connect(reverb).connect(wet).connect(c.destination);if(h){tone(a.midi,n,1.15,c,bus);tone(b.midi,n,1.15,c,bus)}else{tone(a.midi,n,.72,c,bus);tone(b.midi,n+.8,1.15,c,bus)}if(activeMode==='train')trainPlaybackContexts.push(c);setTimeout(()=>closeAudioContext(c),4500);return c}

    function staff(a,b,h,labels){let lines='';for(let i=0;i<5;i++)lines+=`<span class="staff-line" style="bottom:${38+i*14}px"></span>`;const isSecond=h&&Math.abs(a.step-b.step)===1,ax=h?(isSecond?(a.step<b.step?49:53):51):46,bx=h?(isSecond?(b.step<a.step?49:53):51):58,aSide=isSecond&&a.step>b.step?'label-right':'label-left',bSide=isSecond&&b.step<a.step?'label-left':'label-right',one=`<span class="staff-note one ${aSide} ${a.step===-2?'ledger':''}" style="left:${ax}%;bottom:${38+a.step*7}px"><i></i>${labels?`<b>${a.name}</b>`:''}</span>`,two=`<span class="staff-note two ${bSide} ${b.step===-2?'ledger':''}" style="left:${bx}%;bottom:${38+b.step*7}px"><i></i>${labels?`<b>${b.name}</b>`:''}</span>`;return `<div class="staff ${h?'harmony-staff':''} ${isSecond?'harmonic-second':''}"><div class="clef">𝄞</div>${lines}${one}${two}${h?'':'<span class="arrow">→</span>'}</div>`}
    function noteButtons(target,selected,kind,handler){$(target).innerHTML=notes.map((n,i)=>`<button class="${i===selected?'picked '+kind:''}" data-i="${i}" aria-pressed="${i===selected}"><b>${n.name}</b><small>${n.letter}</small></button>`).join('');$(target).querySelectorAll('button').forEach(b=>b.onclick=()=>handler(+b.dataset.i))}
    function renderExplore(){noteButtons('first-notes',first,'first',i=>{first=i;renderExplore()});noteButtons('second-notes',second,'second',i=>{second=i;renderExplore()});$('explore-staff').innerHTML=staff(notes[first],notes[second],isHarmony,true);$('mode-card').className=`mode-card ${isHarmony?'harmony':''}`;$('mode-card').innerHTML=isHarmony?'<span>♬</span><p><b>和聲音程</b>兩個音「同時」發聲，所以樂譜會上下對齊排列。</p>':'<span>♩</span><p><b>曲調音程</b>兩個音「先後」出現，就像旋律向前走。</p>';const degree=Math.abs(second-first)+1,dir=first<=second?1:-1,path=Array.from({length:degree},(_,i)=>notes[first+i*dir]);$('degree').textContent=degree;$('pair').textContent=`${notes[first].name} → ${notes[second].name}`;$('path').innerHTML=path.map((n,i)=>`<div class="chip"><span>${i+1}</span><b>${n.name}</b></div>`).join('');$('explain').textContent=`從 ${notes[first].name} 數到 ${notes[second].name}，頭尾都包含，剛好是 ${degree} 個音名。`;$('melody').classList.toggle('selected',!isHarmony);$('harmony').classList.toggle('selected',isHarmony);$('play-explore').innerHTML=`▶ 聽聽看 · ${isHarmony?'和聲':'曲調'}音程`}

    function makeQuizPlan(){const degrees=[2,3,4,5,6,7,8].sort(()=>Math.random()-.5).slice(0,5),types=[false,true,false,true,Math.random()>.5];return degrees.map((degree,index)=>({degree:degree,h:types[index]})).sort(()=>Math.random()-.5)}
    function newQuestion(){const planned=quizPlan[quizQuestionIndex++]||makeQuizPlan()[0],distance=planned.degree-1,start=Math.floor(Math.random()*(8-distance)),up=Math.random()>.5;return{a:up?start:start+distance,b:up?start+distance:start,h:planned.h}}
        function autoplayQuizHarmony(){if(finished)return;const a=notes[question.a],b=notes[question.b],h=question.h;setTimeout(()=>{try{play(a,b,h)}catch(e){}},420);setTimeout(()=>{try{play(a,b,h)}catch(e){}},2000)}
function startQuiz(){quizPlan=makeQuizPlan();quizQuestionIndex=0;question=newQuestion();qNo=1;answer=null;degreeAnswer=null;typeAnswer=null;checked=false;score=0;finished=false;show('quiz');renderQuiz();autoplayQuizHarmony()}
    function renderQuiz(){if(finished){const msg=score===5?'全部答對，你已經是音程小達人！':score>=3?'很不錯！兩種題型都掌握得很好。':'回到自由探索多聽、多數幾組音，再來挑戰一定會進步！';$('quiz-view').innerHTML='<div class="card finish"><div style="color:var(--coral);font-size:28px">✦ ♪ ✦</div><p class="eyebrow" style="color:var(--purple);margin-top:18px">QUIZ COMPLETE</p><h2>完成挑戰！</h2><div class="score"><b>'+score+'</b><span>/ 5 題</span></div><p>'+msg+'</p><div class="actions"><button class="secondary" id="back-explore">回自由探索</button><button class="primary" id="restart">再挑戰一次</button></div></div>';$('back-explore').onclick=()=>show('explore');$('restart').onclick=startQuiz;return}const degree=Math.abs(question.b-question.a)+1,typeCorrect=question.h?'harmony':'melody',isRight=degreeAnswer===degree&&typeAnswer===typeCorrect,checkedFeedback=checked?'<div class="feedback '+(isRight?'good':'bad')+'"><span>'+(isRight?'✓':'!')+'</span><p><b>'+(isRight?'答對了，太棒了！':'再想一下，答案是 '+degree+' 度、'+(question.h?'和聲音程':'曲調音程'))+'</b><br>音程度數要包含頭尾；先後播放是曲調音程，同時播放是和聲音程。</p><button id="next">'+(qNo===5?'看成績':'下一題')+' →</button></div>':'',degreeButtons=[1,2,3,4,5,6,7,8].map(d=>'<button data-degree="'+d+'" '+(checked?'disabled':'')+' class="'+(degreeAnswer===d?'chosen ':'')+(checked&&d===degree?'correct ':'')+(checked&&degreeAnswer===d&&d!==degree?'wrong':'')+'"><b>'+d+'</b><span>度</span></button>').join(''),typeButtons=[['melody','曲調音程','先後播放'],['harmony','和聲音程','同時播放']].map(item=>'<button data-type="'+item[0]+'" '+(checked?'disabled':'')+' class="'+(typeAnswer===item[0]?'chosen ':'')+(checked&&item[0]===typeCorrect?'correct ':'')+(checked&&typeAnswer===item[0]&&item[0]!==typeCorrect?'wrong':'')+'"><b>'+item[1]+'</b><span>'+item[2]+'</span></button>').join('');$('quiz-view').innerHTML='<div class="card"><div class="progress"><span style="width:'+qNo*20+'%"></span></div><div class="stage-bubbles">'+[1,2,3,4,5].map(n=>'<i class="'+(n<=qNo?'on':'')+'"></i>').join('')+'</div><p class="quiz-scene-title">音樂祭舞台任務 · <b>同時完成兩個判斷</b></p><div class="heading"><div><span class="tag coral">QUESTION '+qNo+'</span><h2>這組音程是曲調還是和聲？幾度？</h2></div><span class="qtype">● 雙重挑戰</span></div>'+staff(notes[question.a],notes[question.b],question.h,true)+'<button class="listen" id="play-quiz">▶ 播放音程</button><div class="answer-group"><h3>① 判斷播放方式</h3><div class="answers type-answers">'+typeButtons+'</div></div><div class="answer-group"><h3>② 數一數音程度數</h3><div class="answers degree-answers">'+degreeButtons+'</div></div>'+(checked?checkedFeedback:'<button class="primary" id="check" disabled>確認兩個答案</button>')+'</div><aside class="card result quiz-side"><span class="tag lime">挑戰進行中</span><div class="circle"><b>'+score+'</b><span>目前答對</span></div><div class="rules"><b>每題要完成兩個判斷</b><ol><li>判斷曲調或和聲</li><li>數出音程是幾度</li><li>兩個答案都正確才得分</li></ol></div><div class="tip"><span>👂</span><p><b>先聽，再看譜</b><br>先後播放是曲調；同時播放是和聲。數度時要包含起點和終點。</p></div></aside>';$('play-quiz').onclick=()=>play(notes[question.a],notes[question.b],question.h);document.querySelectorAll('.type-answers button').forEach(b=>b.onclick=()=>{if(!checked){typeAnswer=b.dataset.type;renderQuiz()}});document.querySelectorAll('.degree-answers button').forEach(b=>b.onclick=()=>{if(!checked){degreeAnswer=+b.dataset.degree;renderQuiz()}});if(!checked){$('check').disabled=degreeAnswer===null||typeAnswer===null;$('check').onclick=()=>{if(degreeAnswer!==null&&typeAnswer!==null){checked=true;const isCorrect=degreeAnswer===degree&&typeAnswer===typeCorrect;if(isCorrect)score++;playQuizFeedback(isCorrect);renderQuiz()}}}else $('next').onclick=()=>{if(qNo===5)finished=true;else{qNo++;question=newQuestion();degreeAnswer=null;typeAnswer=null;checked=false;renderQuiz();autoplayQuizHarmony();return}renderQuiz()};$('mission-label').textContent='第 '+qNo+' 題';$('mission-value').textContent=score+' 分'}
    function makeTrainQuestion(){const degree=2+Math.floor(Math.random()*7),distance=degree-1,start=trainDirection==='up'?Math.floor(Math.random()*(8-distance)):distance+Math.floor(Math.random()*(8-distance)),direction=trainDirection==='up'?1:-1,path=Array.from({length:degree},(_,i)=>start+i*direction),choices=new Set(path.slice(1));while(choices.size<Math.min(6,degree+2))choices.add(Math.floor(Math.random()*8));const options=[...choices];for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}return{degree,start,path,options}}

        if(r>=2&&Math.random()<(r===2?.15:.32))continue;
        if(r===3&&!shooterNeighbors(r,c).some(next=>next.r===2&&shooterAt(next.r,next.c))&&!shooterAt(r,c-1))continue;
        const variant=Math.random()<.15?1:0;
        shooterBoard.push({r,c,note:shooterTypes[(Math.floor(c/2)+r+variant)%shooterTypes.length],gray:false});
      }
    }
    function renderShooterBoard(){
      const grid=$('bubble-grid');if(!grid)return;
      const metrics=shooterMetrics();
      grid.innerHTML=shooterBoard.map(cell=>{
        const point=shooterPoint(cell.r,cell.c,metrics),label=cell.gray?'×':notes[cell.note].name,color=cell.gray?'#aeb8c8':bubbleColor(cell.note);
        return'<span class="grid-bubble'+(cell.gray?' gray':'')+'" data-cell="'+shooterKey(cell)+'" style="left:'+point.x+'px;top:'+point.y+'px;width:'+metrics.radius*2+'px;height:'+metrics.radius*2+'px;font-size:'+Math.max(10,metrics.radius*.5)+'px;background:'+color+'" aria-hidden="true">'+label+'</span>';
      }).join('');
      if($('shooter-board-summary'))$('shooter-board-summary').textContent='棋盤上有 '+shooterBoard.filter(cell=>!cell.gray).length+' 顆唱名泡泡、'+shooterBoard.filter(cell=>cell.gray).length+' 顆灰色障礙。';
      updateShooterAim();
    }
    function renderShooter(){
      const device=touchInput?'拖曳手指瞄準，放開發射':'滑鼠瞄準並點擊，或方向鍵／空白鍵';
      if(shooterStatus==='ready'){
        $('shooter-view').innerHTML='<div class="card shooter-panel"><div class="shooter-ready"><div class="shooter-ready-icon">🫧</div><span class="tag">BUBBLE INTERVAL</span><h2>音程泡泡龍</h2><p>自由瞄準，泡泡碰牆會反彈。虛線與光圈會標出先碰到的泡泡；空隙不夠寬時，發射泡泡無法穿過。答對後泡泡會黏在棋盤上，只有相鄰三顆同唱名才消除；射錯會留下灰色障礙。</p><div class="shooter-mode-actions"><button class="primary shooter-start" id="start-shooter-practice">一般練習 · 錯 3 次結束</button><button class="secondary" id="start-shooter-timed">進階挑戰 · 60 秒</button></div><div class="shooter-help"><span>'+device+'</span><span>每 3 發天花板下降</span><span>消除與連鎖有額外分數</span></div></div></div>';
        $('start-shooter-practice').onclick=()=>startShooter('practice');
        $('start-shooter-timed').onclick=()=>startShooter('timed');
        return;
      }
      if(shooterStatus==='finished'){
        $('shooter-view').innerHTML='<div class="card shooter-panel"><div class="shooter-finished"><span class="tag">CHALLENGE COMPLETE</span><h2>挑戰完成！</h2><p class="shooter-final-score">'+shooterPoints+'<small> 分</small></p><p>'+shooterFinishReason+'<br>答對 '+shooterScore+' 題、消除 '+shooterPopped+' 顆，最高連擊 '+shooterBest+'×。</p><div class="shooter-actions"><button class="secondary" id="shooter-back">回自由探索</button><button class="primary" id="shooter-restart">再挑戰一次</button></div></div></div>';
        $('shooter-back').onclick=()=>show('explore');$('shooter-restart').onclick=()=>startShooter(shooterMode);
        return;
      }
      $('shooter-view').innerHTML='<div class="card shooter-panel"><div class="shooter-top"><div><span class="tag">BUBBLE INTERVAL</span><h2>音程泡泡龍</h2></div><div class="shooter-device"><i class="device-dot"></i>'+device+'</div></div><div class="shooter-hud"><div class="hud-item"><span>'+(shooterMode==='timed'?'剩餘時間':'失誤次數')+'</span><b id="shooter-limit"></b></div><div class="hud-item"><span>答對</span><b id="shooter-score"></b></div><div class="hud-item"><span>消除</span><b id="shooter-popped"></b></div><div class="hud-item"><span>得分</span><b id="shooter-points"></b></div><div class="hud-item"><span>COMBO</span><b id="shooter-combo"></b></div></div><div class="shooter-prompt" id="shooter-question" aria-live="polite"></div><div class="shooter-arena" id="shooter-arena" aria-label="泡泡龍棋盤，拖曳瞄準後放開發射"><div class="arena-stars"></div><div class="bubble-danger"></div><svg class="bubble-aim" aria-hidden="true"><polyline id="aim-path"></polyline><circle id="aim-impact"></circle></svg><div class="bubble-grid" id="bubble-grid"></div><div class="shooter-cannon"></div><div class="bubble-instruction">虛線停住處＝第一個碰到的泡泡</div><div id="shooter-feedback"></div></div><div class="shooter-controls"><span id="shooter-board-summary"></span><button id="shooter-switch" type="button">'+(shooterMode==='timed'?'切換到一般練習':'切換到進階挑戰')+'</button><button id="shooter-fire" type="button">發射泡泡</button></div></div>';
      const arena=$('shooter-arena');
      arena.onpointerdown=event=>{
        if(shooterAnswered||shooterStatus!=='running')return;
        shooterPointerId=event.pointerId;arena.setPointerCapture(event.pointerId);setShooterAim(event.clientX,event.clientY);
      };
      arena.onpointermove=event=>{if(shooterAnswered)return;if(shooterPointerId===event.pointerId||shooterPointerId===null&&event.pointerType==='mouse')setShooterAim(event.clientX,event.clientY)};
      arena.onpointerup=event=>{
        if(shooterPointerId!==event.pointerId)return;
        setShooterAim(event.clientX,event.clientY);shooterPointerId=null;arena.releasePointerCapture(event.pointerId);fireShooterBubble();
      };
      arena.onpointercancel=()=>{shooterPointerId=null};
      $('shooter-fire').onclick=fireShooterBubble;$('shooter-switch').onclick=()=>startShooter(shooterMode==='timed'?'practice':'timed');
      renderShooterBoard();updateShooterAim();updateShooterHud();
    }
    function setShooterAim(clientX,clientY){
      const arena=$('shooter-arena');if(!arena)return;
      const rect=arena.getBoundingClientRect(),dx=clientX-rect.left-rect.width/2,dy=Math.min(-24,clientY-rect.top-(rect.height-46));
      shooterAimAngle=Math.max(-Math.PI+.2,Math.min(-.2,Math.atan2(dy,dx)));
      updateShooterAim();
    }
    function updateShooterAim(){
      const path=$('aim-path'),impact=$('aim-impact'),arena=$('shooter-arena');if(!path||!impact||!arena)return;
      arena.querySelectorAll('.grid-bubble.aim-hit').forEach(bubble=>bubble.classList.remove('aim-hit'));
      if(shooterAnswered){path.setAttribute('points','');impact.style.display='none';return}
      const metrics=shooterMetrics(),trace=traceShooterShot(shooterAimAngle,metrics,true);
      path.setAttribute('points',trace.path.map(point=>point.x.toFixed(1)+','+point.y.toFixed(1)).join(' '));
      impact.setAttribute('cx',trace.x);impact.setAttribute('cy',trace.y);impact.setAttribute('r',metrics.radius*.55);
      impact.style.display='';
      if(trace.hit){
        const bubble=arena.querySelector('[data-cell="'+shooterKey(trace.hit)+'"]');
        if(bubble)bubble.classList.add('aim-hit');
      }
    }
    function newShooterRound(){
      if(shooterStatus!=='running')return;
      if(!shooterBoard.some(cell=>!cell.gray))addShooterRow();
      shooterQuestion=makeShooterQuestion();
      if(!shooterQuestion){
        for(let attempt=0;attempt<6&&!shooterQuestion;attempt++){
          initialShooterBoard();renderShooterBoard();shooterQuestion=makeShooterQuestion();
        }
        if(!shooterQuestion){finishShooter('棋盤沒有可射的唱名，請重新開始。');return}
        $('shooter-feedback').className='shooter-feedback good';
        $('shooter-feedback').textContent='剛才沒有可射擊的唱名，已免費換新棋盤。';
      }else{$('shooter-feedback').className='';$('shooter-feedback').innerHTML=''}
      shooterRound++;shooterAnswered=false;
      $('shooter-question').innerHTML=shooterPrompt(shooterQuestion);
      updateShooterHud();updateShooterAim();setTimeout(announceShooter,120);
    }
    function changeShooterAim(direction){
      if(shooterStatus!=='running'||shooterAnswered)return;
      shooterAimAngle=Math.max(-Math.PI+.2,Math.min(-.2,shooterAimAngle+direction*.09));
      updateShooterAim();
    }
    function fireShooterBubble(){
      if(shooterStatus!=='running'||shooterAnswered||!shooterQuestion)return;
      shooterAnswered=true;shooterShots++;
      const arena=$('shooter-arena'),metrics=shooterMetrics(),question=shooterQuestion;
      const trace=traceShooterShot(shooterAimAngle,metrics,true,null,question.target);
      updateShooterAim();
      const shot=document.createElement('span');shot.className='shot-bubble';shot.textContent='?';
      shot.style.width=metrics.radius*2+'px';shot.style.height=metrics.radius*2+'px';shot.style.fontSize=metrics.radius+'px';
      arena.appendChild(shot);
      const speed=630,points=trace.path;let started=null;
      const frame=time=>{
        if(shooterStatus!=='running'||shooterQuestion!==question){shot.remove();return}
        if(started===null)started=time;
        const position=(time-started)*speed/1000/trace.step;
        if(position>=points.length-1){settleShooterShot(question,trace.hit,shot,trace.x,trace.y,metrics);return}
        const index=Math.floor(position),fraction=position-index,from=points[index],to=points[index+1];
        shot.style.left=from.x+(to.x-from.x)*fraction+'px';
        shot.style.top=from.y+(to.y-from.y)*fraction+'px';
        shooterAnimation=requestAnimationFrame(frame);
      };
      shot.style.left=metrics.originX+'px';shot.style.top=metrics.originY+'px';
      shooterAnimation=requestAnimationFrame(frame);
    }
    function findShooterLanding(hit,x,y,metrics){
      let spots=hit?shooterNeighbors(hit.r,hit.c):Array.from({length:SHOOTER_COLS},(_,c)=>({r:0,c}));
      spots=spots.filter(cell=>cell.r<12&&!shooterAt(cell.r,cell.c));
      if(!spots.length&&!hit){
        shooterBoard.filter(cell=>cell.r===0).forEach(cell=>spots.push(...shooterNeighbors(cell.r,cell.c).filter(next=>!shooterAt(next.r,next.c))));
      }
      spots.sort((a,b)=>{
        const pointA=shooterPoint(a.r,a.c,metrics),pointB=shooterPoint(b.r,b.c,metrics);
        return Math.hypot(pointA.x-x,pointA.y-y)-Math.hypot(pointB.x-x,pointB.y-y);
      });
      return spots[0]||null;
    }
    function sameShooterGroup(start){
      const byKey=new Map(shooterBoard.map(cell=>[shooterKey(cell),cell])),seen=new Set([shooterKey(start)]),queue=[start];
      for(let i=0;i<queue.length;i++)shooterNeighbors(queue[i].r,queue[i].c).forEach(next=>{
        const cell=byKey.get(shooterKey(next)),key=shooterKey(next);
        if(cell&&!cell.gray&&cell.note===start.note&&!seen.has(key)){seen.add(key);queue.push(cell)}
      });
      return queue;
    }
    function dropLooseShooterBubbles(){
      const byKey=new Map(shooterBoard.map(cell=>[shooterKey(cell),cell])),queue=shooterBoard.filter(cell=>cell.r===0),seen=new Set(queue.map(shooterKey));
      for(let i=0;i<queue.length;i++)shooterNeighbors(queue[i].r,queue[i].c).forEach(next=>{
        const key=shooterKey(next),cell=byKey.get(key);
        if(cell&&!seen.has(key)){seen.add(key);queue.push(cell)}
      });
      const removed=shooterBoard.length-seen.size;
      shooterBoard=shooterBoard.filter(cell=>seen.has(shooterKey(cell)));
      return removed;
    }
    function addShooterRow(){
      shooterBoard.forEach(cell=>cell.r++);shooterPhase=(shooterPhase+1)%2;
      for(let c=0;c<SHOOTER_COLS;c++)shooterBoard.push({r:0,c,note:shooterTypes[Math.floor(Math.random()*shooterTypes.length)],gray:false});
      renderShooterBoard();
    }
    function shooterReachedBottom(){
      const metrics=shooterMetrics();
      return shooterBoard.some(cell=>shooterPoint(cell.r,cell.c,metrics).y+metrics.radius>=metrics.height-111);
    }
    function settleShooterShot(question,hit,shot,x,y,metrics){
      if(shooterStatus!=='running'||shooterQuestion!==question)return;
      cancelAnimationFrame(shooterAnimation);shooterAnimation=null;shot.remove();
      const landing=findShooterLanding(hit,x,y,metrics);
      if(!landing){finishShooter('棋盤已經擠滿，火炮無法再接上泡泡。');return}
      const correct=!!hit&&!hit.gray&&hit.note===question.target;
      const placed={...landing,note:correct?question.target:-1,gray:!correct};
      shooterBoard.push(placed);
      const counted=Array.from({length:question.degree},(_,i)=>notes[question.start+i*(question.up?1:-1)].name).join(' → ');
      let popped=0,dropped=0;
      if(correct){
        shooterScore++;shooterCombo++;shooterBest=Math.max(shooterBest,shooterCombo);
        shooterPoints+=10+Math.max(0,shooterCombo-1)*2;
        const group=sameShooterGroup(placed);
        if(group.length>=3){
          const gone=new Set(group.map(shooterKey));popped=group.length;
          shooterBoard=shooterBoard.filter(cell=>!gone.has(shooterKey(cell)));
          dropped=dropLooseShooterBubbles();
          shooterPopped+=popped+dropped;shooterPoints+=popped*5+dropped*3;
        }
        try{play(notes[question.start],notes[question.target],false)}catch(e){}
      }else{
        shooterMisses++;shooterCombo=0;
        if(shooterMode==='timed')shooterTime=Math.max(0,shooterTime-3);
      }
      const allCleared=correct&&!shooterBoard.some(cell=>!cell.gray);if(allCleared){shooterBoard=[];shooterPoints+=50;finishShooter('太棒了！全部泡泡都消除了！');return}
      renderShooterBoard();updateShooterHud();
      const feedback=$('shooter-feedback');feedback.className='shooter-feedback '+(correct?'good':'bad');
      $('shooter-question').textContent='本題已作答 · 下一題準備中…';
      const result=correct?(popped?'答對！消除 '+popped+' 顆'+(dropped?'，連鎖掉落 '+dropped+' 顆':'')+'！':'答對了！這顆先留在棋盤，湊滿三顆才消除。'):(hit?'撞到'+(hit.gray?'灰色障礙':'錯的唱名')+'，留下灰色泡泡。':'碰到天花板，留下灰色泡泡。');
      feedback.innerHTML=result+'<span>正確是 '+notes[question.target].name+'：'+counted+(correct?'':shooterMode==='timed'?'；扣 3 秒':'；失誤 '+shooterMisses+'/3')+'</span>';
      shooterNextTimer=setTimeout(()=>{
        if(shooterStatus!=='running')return;
        if(shooterMode==='practice'&&shooterMisses>=3){finishShooter('已經失誤 3 次，練習結束。');return}
        if(shooterMode==='timed'&&shooterTime<=0){finishShooter('60 秒到了，挑戰結束。');return}
        if(shooterReachedBottom()){finishShooter('泡泡碰到下方警戒線，挑戰結束。');return}
        if(shooterShots%3===0)addShooterRow();
        if(shooterReachedBottom()){finishShooter('天花板下降後，泡泡碰到警戒線。');return}
        newShooterRound();
      },1250);
    }
    function startShooter(mode){
      clearShooterTimers();shooterMode=mode;shooterStatus='running';shooterTime=60;shooterScore=0;shooterPoints=0;shooterPopped=0;shooterMisses=0;shooterCombo=0;shooterBest=0;shooterRound=0;shooterShots=0;shooterQuestion=null;shooterAnswered=false;shooterAimAngle=-Math.PI/2;shooterFinishReason='';
      initialShooterBoard();show('shooter');newShooterRound();
      if(mode==='timed')shooterTick=setInterval(()=>{shooterTime--;updateShooterHud();if(shooterTime<=0)finishShooter('60 秒到了，挑戰結束。')},1000);
    }
    function finishShooter(reason){
      if(shooterStatus!=='running')return;
      clearShooterTimers();shooterStatus='finished';shooterFinishReason=reason||'挑戰完成！';renderShooter();
      $('mission-label').textContent='挑戰完成';$('mission-value').textContent=`${shooterPoints} 分`;
    }
    function resetShooter(){clearShooterTimers();shooterStatus='ready';shooterQuestion=null;shooterAnswered=false}
    function show(mode){
      if(activeMode==='shooter'&&mode!=='shooter'&&shooterStatus==='running')resetShooter();
      activeMode=mode;
      const home=mode==='home',quiz=mode==='quiz',train=mode==='train',shooter=mode==='shooter';
      $('mode-home').classList.toggle('hidden',!home);
      $('hero').classList.toggle('hidden',!home);
      $('story-strip').classList.toggle('hidden',!home);
      $('explore-view').classList.toggle('hidden',home||quiz||train||shooter);
      $('quiz-view').classList.toggle('hidden',!quiz);
      $('train-view').classList.toggle('hidden',!train);
      $('shooter-view').classList.toggle('hidden',!shooter);
      if(home){$('mission-label').textContent='選擇模式';$('mission-value').textContent='開始練習';return}
      if(train){if(!trainQuestion){trainQuestion=makeTrainQuestion();trainPicked=[];trainMessage='先找下一個音符車廂。'}renderTrain();$('mission-label').textContent='基礎練習';$('mission-value').textContent='音階順序'}
      else if(shooter){renderShooter();if(shooterStatus==='ready'){$('mission-label').textContent='自由瞄準';$('mission-value').textContent='選擇模式'}}
      else if(quiz){$('mission-label').textContent='舞台挑戰';$('mission-value').textContent='雙重判斷'}
      else {$('mission-label').textContent='自由探索';$('mission-value').textContent='認識「度」'}
    }
    document.addEventListener('keydown',event=>{if(activeMode!=='shooter'||shooterStatus!=='running')return;if(event.key==='ArrowLeft'){event.preventDefault();changeShooterAim(-1)}if(event.key==='ArrowRight'){event.preventDefault();changeShooterAim(1)}if(event.key===' '||event.key==='Enter'){event.preventDefault();fireShooterBubble()}});
    window.addEventListener('resize',()=>{if(activeMode==='shooter'&&shooterStatus==='running'){renderShooterBoard();updateShooterAim();if(!shooterAnswered&&shooterQuestion&&!reachableShooterNotes().has(shooterQuestion.target))newShooterRound()}});
    function startTrain(){stopTrainPlayback();trainRevealBag=[];trainQuestion=makeTrainQuestion();trainPicked=[];trainStars=0;trainAnswer=null;trainChecked=false;trainDeparting=false;trainMessage='依照題目方向選下一個音。';trainDragIndex=null;show('train')}
    document.addEventListener('click',event=>{if(activeMode!=='train')return;const control=event.target.closest('#train-next,#train-up,#train-down,#story-explore,#story-train,#story-quiz,#story-shooter,#home');if(control)stopTrainPlayback()},true);
    document.addEventListener('click',event=>{if(activeMode!=='quiz'||event.target.id!=='check')return;const answeredQuestion=question;setTimeout(()=>{if(activeMode!=='quiz'||question!==answeredQuestion||!checked)return;if(qNo===5){finished=true;renderQuiz();return}qNo++;question=newQuestion();degreeAnswer=null;typeAnswer=null;checked=false;renderQuiz();autoplayQuizHarmony()},1600)},true);
    $('mode-explore').onclick=()=>show('explore');$('mode-train').onclick=startTrain;$('mode-quiz').onclick=startQuiz;$('mode-shooter').onclick=()=>show('shooter');$('story-explore').onclick=()=>show('explore');$('story-train').onclick=startTrain;$('story-quiz').onclick=startQuiz;$('story-shooter').onclick=()=>show('shooter');$('home').onclick=()=>show('home');renderExplore();show('home');
  </script>
</body>
